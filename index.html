<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeepSake - For memories worth keeping</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div class="mood-tray">
        <div class="mood-items">
          <div class="mood" data-name="angry" id="moodangey">angry</div>
          <div class="mood" data-name="happy" id="moodhappy">happy</div>
          <div class="mood" data-name="sad" id="moodsad">sad</div>
          <div class="mood" data-name="excited" id="moodexcited">excited</div>
        </div>
      </div>
      <div class="memory-modal" id="memoryModal">
        <div class="memoryModalHeader">
          <button class="btn close-btn" id="closeMemory">X</button>
        </div>
        <div class="memoryModalMain"></div>
      </div>
      <div class="input-modal" id="inputModal">
        <div class="form-headeing">
          <h3>New Memory</h3>
          <p>Have a memory want to keep?</p>
        </div>
        <form class="input-form" id="inputForm">
          <div class="form-div">
            <div class="form-component inputTitle">
              <label for="title">Memory Title</label>
              <input
                type="text"
                name="title"
                required
                placeholder="Enter Memory Title..."
              />
            </div>
            <div class="form-component inputDate">
              <label for="date">Date Recorded</label>
              <input type="date" name="date" id="date" required />
            </div>
          </div>
          <div class="form-div">
            <div class="tags-wrapper">
              <div class="tag inputTag" data-mood="happy">Happy</div>
              <div class="tag inputTag" data-mood="angry">Angry</div>
              <div class="tag inputTag" data-mood="sad">Sad</div>
              <div class="tag inputTag" data-mood="excited">Excited</div>
            </div>
            <input type="hidden" id="moodInput" name="moodInput" required />
          </div>

          <div class="form-div">
            <div class="form-component">
              <label for="memory">Your Thoughts</label>
              <textarea
                name="memory"
                id="memoryInput"
                rows="8"
                placeholder="Thoughts about this memory..."
                required
              ></textarea>
            </div>
          </div>
          <div class="form-div">
            <div class="form-component">
              <label for="image">Image</label>
              <input
                type="file"
                id="inputImage"
                name="image"
                required
                accept="image/*"
              />
            </div>
          </div>
          <button class="formBtn btn" type="submit">Submit</button>
        </form>
      </div>
      <div class="app">
        <header>
          <div class="header-heading">
            <div id="logo" class="logo">
              <h1>KeepSake<span>.</span></h1>
            </div>
            <div class="header-subtext">
              <p>for memories worth keeping</p>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn input-btn" id="import">Add New</button>
            <button class="btn reset-btn" id="reset">Reset</button>
          </div>
        </header>
        <main>
          <section class="hero"></section>
          <section class="memories">
            <div class="section-heading">
              <h3>Your Memories</h3>
              <p class="index" id="memoryIndex">2 Memories</p>
            </div>
            <div class="filter-wrapper">
              <p>Filter</p>
              <div class="tags-wrapper">
                <div class="tag" id="">All</div>
                <div class="tag" id="happy">Happy</div>
                <div class="tag" id="angry">Angry</div>
                <div class="tag" id="sad">Sad</div>
                <div class="tag" id="excited">Excited</div>
              </div>
            </div>
            <div class="memories-wrapper" id="memoryContainer"></div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
