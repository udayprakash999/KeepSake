<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./styles/dashboard.css" />
  </head>
  <body>
    <div class="input-modal">
      <form class="inputForm" id="memoryForm">
        <div class="form-component">
          <label for="title">Add Title</label>
          <input
            type="text"
            placeholder="The memory..."
            id="title"
            name="title"
            required
          />
        </div>
        <div class="form-component">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required />
        </div>
        <div class="form-component">
          <label for="journal">Your thoughts...</label>
          <textarea id="journal" name="journal" placeholder="journal" rows="5" required></textarea>
          
        </div>
        <div class="form-component">
          <label for="image">Image</label>
          <input type="file" id="inputImage" name="image" accept="image/*" />
        </div>
        <button type="submit">Save Memory</button>
      </form>
    </div>
    <div class="dashboard-wrapper">
      <nav>
        <div class="logo-icon">K</div>
        <div class="nav-actions">
          <div class="nav-action add" id="import">
            <span>+</span>
          </div>
          <div class="nav-action profile">
            <span>U</span>
          </div>
        </div>
      </nav>
      <main>
        <div class="content">
          <div class="welcome-text">
            <h2>Hello User</h2>
          </div>
          <div class="quote-wrapper" id="quoteContainer">
            <h4 id="quote"></h4>
          </div>
        </div>
        <div class="memories"></div>

        <div class="moodboard"></div>
      </main>
    </div>
    <script src="./js/dashboard.js"></script>
  </body>
</html>
