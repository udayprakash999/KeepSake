<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./styles/dashboard.css" />
  </head>
  <body>
    <div class="input-modal">
      <form class="input" id="inputForm">
        <!-- <input type="text" placeholder="Enter your data"> -->
        <input type="file" id="inputImage" accept="image/*" />
        <button type="submit">Submit</button>
      </form>
    </div>
    <div class="dashboard-wrapper">
      <nav>
        <div class="logo-icon">K</div>
        <div class="nav-actions">
          <div class="nav-action add" id="import">
            <span>+</span>
          </div>
          <div class="nav-action profile">
            <span>U</span>
          </div>
        </div>
      </nav>
      <main>
        <div class="content">
          <div class="welcome-text">
            <h2>Hello User</h2>
          </div>
          <div class="quote-wrapper">
            <h4>
              Lorem picusm Lorem ipsum dolor sit, amet consectetur adipisicing
              elit. Maiores neque eius quas repudiandae. Laboriosam ipsam cumque
              quibusdam eligendi. Vero, voluptatem porro nisi id nobis ratione
              iusto repellendus quod voluptatum exercitationem.
            </h4>
          </div>
        </div>
        <div class="memories"></div>

        <div class="moodboard"></div>
      </main>
    </div>
    <script src="./js/dashboard.js"></script>
  </body>
</html>
